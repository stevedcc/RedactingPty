name: Publish to NuGet

# Triggers on version tags (v1.0.0, v1.2.3-beta1, ...). Requires a NUGET_API_KEY repo
# secret (Settings -> Secrets and variables -> Actions) generated from a nuget.org
# API key scoped to the RedactingPty package.
on:
  push:
    tags: ["v*"]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test RedactingPty.slnx

      - name: Derive package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack RedactingPty/RedactingPty.csproj -c Release -o out -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Push to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
