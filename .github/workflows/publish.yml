name: Publish to NuGet

# Triggers on version tags (v1.0.0, v1.2.3-beta1, ...). Uses NuGet Trusted Publishing
# (OIDC) instead of a stored API key: no long-lived secret to leak or rotate. Requires
# a Trusted Publishing policy configured on nuget.org (account -> Trusted Publishing)
# pointing at this repo + this workflow file, and a NUGET_USER repo secret holding
# your nuget.org profile name (not your email, not a key).
on:
  push:
    tags: ["v*"]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for NuGet Trusted Publishing's OIDC token exchange
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test RedactingPty.slnx

      - name: Derive package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack RedactingPty/RedactingPty.csproj -c Release -o out -p:Version=${{ env.PACKAGE_VERSION }}

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
