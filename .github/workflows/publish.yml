name: Publish to NuGet

# Triggers on version tags (v1.0.0, v1.2.3-beta1, ...). Uses NuGet Trusted Publishing
# (OIDC) instead of a stored API key: no long-lived secret to leak or rotate. Requires
# a Trusted Publishing policy configured on nuget.org (account -> Trusted Publishing)
# pointing at this repo + this workflow file, and a NUGET_USER repo secret holding
# your nuget.org profile name (not your email, not a key).
on:
  push:
    tags: ["v*"]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Runs the repo's code (tests, pack) with a read-only token and no OIDC token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test RedactingPty.slnx

      - name: Derive package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack RedactingPty/RedactingPty.csproj -c Release -o out "-p:Version=$PACKAGE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: out/*.nupkg
          if-no-files-found: error
          overwrite: true # a "Re-run all jobs" uploads the artifact again under the same name

  # Holds the write permissions; no checkout, so no repo code runs here. Its actions are pinned by
  # commit, since they run with these permissions.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # NuGet Trusted Publishing's OIDC token exchange, and the provenance attestation's signing
      attestations: write # store the build provenance attestation
      contents: write # create the tag's GitHub release and attach the attested .nupkg
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: out

      # Build provenance for the package (no .snupkg is built or pushed). The attested file is the one
      # attached to the GitHub release below (nuget.org adds its repository signature to its copy, so that
      # file differs). Check it with `gh attestation verify <file>.nupkg --repo stevedcc/RedactingPty`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.nupkg

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The attested .nupkg on the tag's GitHub release: created here, or added to a release that
      # already exists (a rerun replaces the file). GH_REPO: there is no checkout for gh to read it from.
      - name: Attach the attested package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*.nupkg --clobber
          else
            prerelease=()
            if [[ "$PACKAGE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" out/*.nupkg --verify-tag --title "$GITHUB_REF_NAME" "${prerelease[@]}" \
              --notes "RedactingPty $PACKAGE_VERSION: https://www.nuget.org/packages/RedactingPty/$PACKAGE_VERSION. The attached .nupkg is the attested build; see the README (Install) for how to check it."
          fi
